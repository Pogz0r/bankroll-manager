<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1528"/>
      <stop offset="100%" stop-color="#07090f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00b248" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="gshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <text
    x="16" y="24"
    text-anchor="middle"
    font-family="'Bebas Neue', Impact, 'Arial Black', sans-serif"
    font-size="20"
    font-weight="700"
    fill="#00e676"
    filter="url(#gshadow)"
    letter-spacing="0"
  >B</text>
</svg>
