<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BankrollPro{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  {% block head %}{% endblock %}
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-logo">
      <div class="logo-mark">BDC</div>
      <div class="logo-text">BANKROLL<span class="accent">PRO</span></div>
    </a>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/bets" class="nav-item {% if request.endpoint == 'bets_page' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
        <span>My Bets</span>
      </a>
      <a href="/analytics" class="nav-item {% if request.endpoint == 'analytics_page' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span>Analytics</span>
      </a>
      <a href="/kelly" class="nav-item {% if request.endpoint == 'kelly_page' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="8" x2="10" y1="10" y2="10"/><line x1="14" x2="16" y1="10" y2="10"/><line x1="8" x2="10" y1="14" y2="14"/><line x1="14" x2="16" y1="14" y2="14"/><line x1="8" x2="10" y1="18" y2="18"/><line x1="14" x2="16" y1="18" y2="18"/></svg>
        <span>Kelly Calculator</span>
      </a>
      <a href="/settings" class="nav-item {% if request.endpoint == 'settings_page' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-badge" id="user-badge" style="display:none">
        <img src="" id="user-pic" alt="avatar">
        <div class="user-badge-info">
          <div class="user-badge-name" id="user-name"></div>
        </div>
      </div>
      <a href="/logout" class="nav-item logout">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <header class="mobile-header">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <span class="mobile-logo">BANKROLL<span class="accent">PRO</span></span>
    </header>

    {% block content %}{% endblock %}
  </main>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<!-- Sidebar overlay for mobile -->
<div id="sidebar-overlay" style="display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,0.5);"
  onclick="document.getElementById('sidebar').classList.remove('open');this.style.display='none'"></div>

<script>
// Global helpers
function showToast(msg, type='success') {
  const tc = document.getElementById('toast-container');
  const icons = {
    success: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
    error:   '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg>',
    info:    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
  };
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = icons[type] + msg;
  tc.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function fmt(n, prefix='$') {
  if (n === null || n === undefined) return '—';
  const abs = Math.abs(n);
  const s = abs >= 1000 ? prefix + abs.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2})
                        : prefix + abs.toFixed(2);
  return n < 0 ? '-' + s : s;
}

function fmtOdds(american) {
  return american >= 0 ? '+' + american : '' + american;
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

// Sidebar toggle
const sidebarEl = document.getElementById('sidebar');
const overlayEl = document.getElementById('sidebar-overlay');
document.querySelector('.menu-toggle') && document.querySelector('.menu-toggle').addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
  overlayEl.style.display = sidebarEl.classList.contains('open') ? 'block' : 'none';
});

// Sport colors
const SPORT_COLORS = {
  NHL:    '#448aff', NBA:  '#ff6d00', NFL: '#66bb6a',
  MLB:    '#ef5350', UFC:  '#ab47bc', Soccer: '#26c6da',
  Tennis: '#ffa726', Other: '#78909c',
};
function sportColor(s) { return SPORT_COLORS[s] || '#78909c'; }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
